<body id=b style="margin:0;
height:100vh;
font: 40px Arial, sans-serif;
color:white;background:rgb(61, 61, 249);text-align:center;">

    <p id=t>CLICK the screen to start!😁</p>
    <script>

        let state = "idle"; // idle makes it wait so green can be clicked, waiting makes it wait for the user to click, and ready makes it ready to click
        let startTime;
        let timer;

        function turnGreen() { //this is when the screen turns green and the user will have to click and the reaction time will be measured in milliseconds
            state = "green";
            b.style.background = "green";
            t.textContent = "CLICK NOW!😎";
            startTime = performance.now();
        }

        onclick = function () {
            if (state == "idle") {
                state = "waiting";
                b.style.background = "red"; //this is when the screen will turn red and the person will have to wait and then quickly press the green. (so this is the "waiting" code basically)
                t.textContent = "Wait for it to turn green...";
                timer = setTimeout(turnGreen, 1000 + Math.random() * 3000); //this is the randomized time the red screen will wait for which is going to be between 1 and 4 seconds
            }
            else if (state === "waiting") {
                clearTimeout(timer);
                state = "idle";
                b.style.background = "orange";
                t.textContent = "BRUHH, you clicked it too soon!😡 Click to try again.";

            } else {
                let ms = Math.round(performance.now() - startTime);
                state = "idle";
                b.style.background = "purple";
                t.textContent = ms + " ms. Click to try again.";
            }
        };

    </script>
</body>
